[project]
name = "pyfa-mcp"
version = "0.3.0"
description = "MCP server exposing Pyfa's EVE Online fitting engine to LLM clients"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
authors = [{ name = "Antoine Jacquin-Ravot" }]
# eos runtime dependencies: exactly vendor/Pyfa/uv.lock at the pinned tag.
dependencies = [
    "logbook==1.9.2",
    "numpy==2.5.1",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "sqlalchemy==2.0.51",
    "cryptography==50.0.0",
    "markdown2==2.5.5",
    "packaging==26.2",
    "roman==5.2",
    "beautifulsoup4==4.15.0",
    "pyyaml==6.0.3",
    "python-jose==3.5.0",
    "requests-cache==1.3.3",
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller==6.22.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyfa_mcp*"]

[tool.setuptools.package-data]
pyfa_mcp = ["unhandled_effects.json", "fitting_guide.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: replays a whole hand-tested search (minutes); skipped in CI"]
